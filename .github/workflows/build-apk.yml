name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          cd makon-demo
          npm ci

      - name: Sync Capacitor Android
        run: |
          cd makon-demo
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd makon-demo/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makon-Hostel-App
          path: makon-demo/android/app/build/outputs/apk/debug/app-debug.apk
